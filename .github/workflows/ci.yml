name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; only the publish job may write packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Third-party actions are pinned to full commit SHAs (version in the comment).
# Dependabot (.github/dependabot.yml) keeps the pins up to date.

jobs:
  server:
    name: Server and Shared (Linux, build + test)
    runs-on: ubuntu-latest
    # PostgreSQL for the concurrency, migration and audit trigger tests (CMS_TEST_POSTGRES)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Build Cms.Shared
        run: dotnet build Cms.Shared/Cms.Shared.csproj -c Release

      - name: Build Cms.Server
        run: dotnet build Cms.Server/Cms.Server.csproj -c Release

      - name: Test (SQLite and PostgreSQL)
        env:
          CMS_TEST_POSTGRES: Host=localhost;Port=5432;Username=cms;Password=ci-only-throwaway;Database=cms
        run: dotnet test tests/Cms.Server.Tests/Cms.Server.Tests.csproj -c Release --logger "trx;LogFileName=server-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-test-results
          path: TestResults

  windows:
    name: Agent, Launcher and Windows server package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Build Cms.Agent.Service
        run: dotnet build Cms.Agent.Service/Cms.Agent.Service.csproj -c Release

      - name: Build Cms.Launcher
        run: dotnet build Cms.Launcher/Cms.Launcher.csproj -c Release

      # Same publish command as scripts/installer/build-packages.ps1 (Windows server install path)
      - name: Publish Cms.Server for Windows (installer layout)
        run: dotnet publish Cms.Server -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/server

      - name: Test server on Windows
        run: dotnet test tests/Cms.Server.Tests/Cms.Server.Tests.csproj -c Release

  admin-ui:
    name: Admin UI (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build (static export to admin-ui/out)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images (build + compose smoke test)
    needs: [server, admin-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Cms.Server/Dockerfile
          load: true
          tags: ccms-server:local
          cache-from: type=gha,scope=ccms-server
          cache-to: type=gha,mode=max,scope=ccms-server

      - name: Build admin UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: admin-ui
          load: true
          tags: ccms-admin-ui:local
          cache-from: type=gha,scope=ccms-admin-ui
          cache-to: type=gha,mode=max,scope=ccms-admin-ui

      - name: Smoke test (docker compose, demo mode)
        env:
          DEMO_MODE: "true"
          CMS_BIND_ADDRESS: 127.0.0.1
        run: |
          POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          export POSTGRES_PASSWORD
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5081/api/health && break
            sleep 2
          done
          # Admin endpoints need a login; the demo staff accounts exist only in demo mode
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5081/api/devices)" = 401
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' -H 'X-CCMS-CSRF: 1' \
            -d '{"username":"demo-owner","password":"demo"}' http://127.0.0.1:5081/api/auth/login > /dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:5081/api/devices \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d) == 20, len(d); print(len(d), "demo PCs")'
          curl -fsS http://127.0.0.1:5081/ | grep -q "<title>"

      - name: Compose logs
        if: failure()
        run: docker compose logs

      - name: Stop compose stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images to ghcr.io (v* tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image owner (ghcr.io needs lowercase)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image tags
        id: meta-server
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/ccms-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Admin UI image tags
        id: meta-ui
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/ccms-admin-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Cms.Server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=ccms-server

      - name: Build and push admin UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: admin-ui
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha,scope=ccms-admin-ui
